name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Seed demo data
        run: npm run seed
      - name: Start server and run API tests
        run: |
          node --no-warnings server/index.js > /tmp/qingzhan.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && break
            sleep 1
          done
          npm test
        env:
          PORT: 3000
          APP_SECRET: ci-only-secret
